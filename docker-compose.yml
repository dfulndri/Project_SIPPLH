services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sipplh_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - sipplh_network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: sipplh_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sipplh_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: sipplh_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sipplh_db
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_USER: sipplh_user
      MYSQL_PASSWORD: sipplh_pass
    ports:
      - "3306:3306"
    volumes:
      - sipplh_dbdata:/var/lib/mysql
    networks:
      - sipplh_network

  redis:
    image: redis:alpine
    container_name: sipplh_redis
    restart: unless-stopped
    networks:
      - sipplh_network

networks:
  sipplh_network:
    driver: bridge

volumes:
  sipplh_dbdata:
    driver: local